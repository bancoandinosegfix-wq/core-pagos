name: CI · Core de Pagos

# Pipeline de integración continua del core. El escaneo y la remediación de vulnerabilidades
# los hace SegFix (job `seguridad`) y el resultado corta el despliegue (job `security-gate`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      umbral:
        description: 'Severidad que rompe el pipeline (none|low|medium|high|critical)'
        required: false
        default: 'high'

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar que el servicio levanta
        run: node -e "require('./src/server.js'); console.log('core-pagos OK')"

  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Ejecutar tests
        run: npm test

  lint:
    name: Calidad de código
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint

  seguridad:
    name: SegFix · escaneo y remediación
    runs-on: ubuntu-latest
    needs: [test, lint]
    # El gate necesita el resultado aunque este job termine en rojo.
    outputs:
      resultado: ${{ steps.segfix.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SegFix escanea el repo, remedia con IA lo que puede y abre un Pull Request con los fixes.
      # La ejecución queda registrada en la consola de SegFix con el origen de este pipeline.
      - name: Escanear y remediar con SegFix
        id: segfix
        continue-on-error: true
        env:
          SEGFIX_TOKEN: ${{ secrets.SEGFIX_TOKEN }}
        run: |
          python ci/segfix_ci.py \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --fail-on "${{ github.event.inputs.umbral || 'high' }}"

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: seguridad
    steps:
      - name: Evaluar el resultado del análisis
        run: |
          if [ "${{ needs.seguridad.outputs.resultado }}" != "success" ]; then
            echo "::error::Security Gate: quedan vulnerabilidades por encima del umbral."
            echo "Revisá el detalle en la consola de SegFix. Si alguna es un falso positivo,"
            echo "excepcionala con justificación y fecha de revisión, y volvé a correr el pipeline."
            exit 1
          fi
          echo "Security Gate aprobado: no quedan vulnerabilidades por encima del umbral."

  package:
    name: Empaquetar imagen
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del core
        run: docker build -t core-pagos:${{ github.sha }} .
      - name: Etiquetar release
        run: echo "Imagen core-pagos:${{ github.sha }} lista para publicar."

  deploy:
    name: Desplegar a staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Desplegar
        run: |
          echo "Desplegando core-pagos:${{ github.sha }} en staging…"
          echo "Despliegue completado."
