name: CI · Core de Pagos

# Pipeline de integración continua del core. El escaneo y la remediación de vulnerabilidades
# los hace SegFix (job `seguridad`) y el resultado corta el despliegue (job `security-gate`).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      umbral:
        description: 'Umbral que rompe el pipeline. auto = usa el perfil de SegFix (recomendado)'
        required: false
        default: 'auto'

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar que el servicio levanta
        run: node -e "require('./src/server.js'); console.log('core-pagos OK')"

  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Ejecutar tests
        run: npm test

  lint:
    name: Calidad de código
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run lint

  seguridad:
    name: SegFix · escaneo y remediación
    runs-on: ubuntu-latest
    needs: [test, lint]
    # El gate necesita el resultado aunque este job termine en rojo.
    outputs:
      resultado: ${{ steps.segfix.outcome }}
      exec_id: ${{ steps.segfix.outputs.exec_id }}
      score: ${{ steps.segfix.outputs.score }}
      score_letra: ${{ steps.segfix.outputs.score_letra }}
      excepted: ${{ steps.segfix.outputs.excepted }}
      exec_url: ${{ steps.segfix.outputs.exec_url }}
      found: ${{ steps.segfix.outputs.found }}
      fixed: ${{ steps.segfix.outputs.fixed }}
      manual: ${{ steps.segfix.outputs.manual }}
      blockers: ${{ steps.segfix.outputs.blockers }}
      blockers_top: ${{ steps.segfix.outputs.blockers_top }}
      pr_url: ${{ steps.segfix.outputs.pr_url }}
      push_error: ${{ steps.segfix.outputs.push_error }}
      threshold: ${{ steps.segfix.outputs.threshold }}
      profile: ${{ steps.segfix.outputs.profile }}
      profile_origin: ${{ steps.segfix.outputs.profile_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SegFix escanea el repo, remedia con IA lo que puede y abre un Pull Request con los fixes.
      # La ejecución queda registrada en la consola de SegFix con el origen de este pipeline.
      - name: Escanear y remediar con SegFix
        id: segfix
        continue-on-error: true
        env:
          SEGFIX_TOKEN: ${{ secrets.SEGFIX_TOKEN }}
        run: |
          # Sin --fail-on: el umbral lo define el PERFIL de seguridad asignado en SegFix a este
          # repositorio o a su proyecto. Se puede forzar desde el disparo manual del workflow.
          python ci/segfix_ci.py \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --fail-on "${{ github.event.inputs.umbral || 'auto' }}"

  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: seguridad
    env:
      EXEC_URL: ${{ needs.seguridad.outputs.exec_url }}
      EXEC_ID: ${{ needs.seguridad.outputs.exec_id }}
      SCORE: ${{ needs.seguridad.outputs.score }}
      SCORE_LETRA: ${{ needs.seguridad.outputs.score_letra }}
      EXCEPTED: ${{ needs.seguridad.outputs.excepted }}
      FOUND: ${{ needs.seguridad.outputs.found }}
      FIXED: ${{ needs.seguridad.outputs.fixed }}
      BLOCKERS: ${{ needs.seguridad.outputs.blockers }}
      BLOCKERS_TOP: ${{ needs.seguridad.outputs.blockers_top }}
      PR_URL: ${{ needs.seguridad.outputs.pr_url }}
      PUSH_ERROR: ${{ needs.seguridad.outputs.push_error }}
      THRESHOLD: ${{ needs.seguridad.outputs.threshold }}
      PROFILE: ${{ needs.seguridad.outputs.profile }}
      PROFILE_ORIGIN: ${{ needs.seguridad.outputs.profile_origin }}
    steps:
      - name: Evaluar el resultado del análisis
        run: |
          echo "════════════════════════════════════════════════════════════════════"
          echo "  SegFix · Security Gate"
          echo "════════════════════════════════════════════════════════════════════"
          echo ""
          if [ -n "$SCORE" ]; then
            echo "  ★ SCORE DE SEGURIDAD: ${SCORE}/100  —  nota ${SCORE_LETRA}"
            echo "    (parte de 100 y descuenta por cada vulnerabilidad que queda abierta;"
            echo "     lo remediado y lo exceptuado no descuentan)"
            echo ""
          fi
          echo "  Vulnerabilidades encontradas ....... ${FOUND:-0}"
          echo "  Remediadas automáticamente por IA .. ${FIXED:-0}"
          if [ -n "$EXCEPTED" ] && [ "$EXCEPTED" != "0" ]; then
            echo "  Exceptuadas (con revisión pactada) . ${EXCEPTED}"
          fi
          if [ -n "$PROFILE_ORIGIN" ]; then
            echo "  Perfil de seguridad aplicado ....... ${PROFILE_ORIGIN}"
          fi
          echo "  Umbral que bloquea el despliegue ... ${THRESHOLD:-high} o superior"
          echo ""
          if [ -n "$PR_URL" ]; then
            echo "  Pull Request con los fixes:"
            echo "    $PR_URL"
            echo ""
          elif [ -n "$PUSH_ERROR" ]; then
            echo "  ⚠️  Las correcciones se generaron pero NO se pudieron escribir en el repositorio,"
            echo "      así que todavía no hay Pull Request. Es un problema de credenciales del repo,"
            echo "      no del análisis. Motivo:"
            echo "        ${PUSH_ERROR}"
            echo ""
          fi
          echo "  Detalle completo de la ejecución #${EXEC_ID:-?} en SegFix:"
          echo "    ${EXEC_URL:-https://platform.segfix.io/ejecuciones}"
          echo ""

          if [ "${{ needs.seguridad.outputs.resultado }}" = "success" ]; then
            echo "  ✅ APROBADO — no quedan vulnerabilidades de severidad ${THRESHOLD:-high} o superior."
            echo "     El despliegue continúa."
            echo "════════════════════════════════════════════════════════════════════"
            exit 0
          fi

          echo "  ⛔ BLOQUEADO — quedan ${BLOCKERS:-?} vulnerabilidades de severidad ${THRESHOLD:-high} o superior."
          if [ -n "$BLOCKERS_TOP" ]; then
            echo ""
            echo "     Bloquean: ${BLOCKERS_TOP}"
          fi
          echo ""
          echo "  ── Cómo destrabarlo ────────────────────────────────────────────"
          echo "   1. Abrí la ejecución en SegFix y revisá cada hallazgo:"
          echo "        ${EXEC_URL}"
          echo "   2. Si alguno es un falso positivo o un riesgo aceptado, excepcionalo"
          echo "      desde la consola con justificación y fecha de compromiso de revisión."
          echo "   3. Volvé a correr este pipeline: con las excepciones aplicadas el gate"
          echo "      pasa y el despliegue continúa."
          echo "════════════════════════════════════════════════════════════════════"

          echo "::error title=Despliegue bloqueado por SegFix::Score de seguridad ${SCORE:-?}/100 (${SCORE_LETRA:-?}). Quedan ${BLOCKERS:-?} vulnerabilidades de severidad ${THRESHOLD:-high} o superior sin resolver. Revisalas en ${EXEC_URL}"
          exit 1

  package:
    name: Empaquetar imagen
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen del core
        run: docker build -t core-pagos:${{ github.sha }} .
      - name: Etiquetar release
        run: echo "Imagen core-pagos:${{ github.sha }} lista para publicar."

  deploy:
    name: Desplegar a staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Desplegar
        id: deploy
        run: |
          echo "Desplegando core-pagos:${{ github.sha }} en staging…"
          echo "url=${{ vars.STAGING_URL || 'http://core-pagos-demo.secfix.svc.cluster.local:8080' }}" >> "$GITHUB_OUTPUT"
          echo "Despliegue completado."

  # DAST: con la aplicación YA CORRIENDO en staging, SegFix la ataca como lo haría un atacante.
  # Encuentra lo que el análisis del código no puede ver: cabeceras, sesiones, configuración expuesta.
  dast:
    name: SegFix · análisis dinámico (DAST)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Atacar la aplicación desplegada
        env:
          SEGFIX_TOKEN: ${{ secrets.SEGFIX_TOKEN }}
        run: |
          python ci/segfix_ci.py \
            --dast "${{ needs.deploy.outputs.url }}" \
            --branch "${{ github.head_ref || github.ref_name }}"
